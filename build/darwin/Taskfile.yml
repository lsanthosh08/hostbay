version: '3'

includes:
  common: ../Taskfile.yml

vars:
  # Docker image for cross-compilation (used when building on non-macOS)
  CROSS_IMAGE: wails-cross
  # Finder shows the bundle's folder name, so the .app is Hostbay.app while the
  # executable inside keeps APP_NAME (CFBundleExecutable in Info.plist).
  APP_BUNDLE: Hostbay

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: '{{if eq OS "darwin"}}build:native{{else}}build:docker{{end}}'
        vars:
          ARCH: '{{.ARCH}}'
          DEV: '{{.DEV}}'
          OUTPUT: '{{.OUTPUT}}'
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'
          OBFUSCATED: '{{.OBFUSCATED}}'
          GARBLE_ARGS: '{{.GARBLE_ARGS}}'
    vars:
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'

  build:native:
    summary: Builds the application natively on macOS
    internal: true
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          OBFUSCATED:
            ref: .OBFUSCATED
          DEV:
            ref: .DEV
      - task: common:generate:icons
    preconditions:
      - sh: '{{if eq .OBFUSCATED "true"}}command -v garble >/dev/null 2>&1{{else}}true{{end}}'
        msg: "garble is required for obfuscated builds. Install it with: go install mvdan.cc/garble@v0.16.0 (requires Go 1.24+). See https://github.com/burrowers/garble/releases for version/toolchain compatibility."
    cmds:
      - '{{if eq .OBFUSCATED "true"}}garble {{.GARBLE_ARGS}} build{{else}}go build{{end}} {{.BUILD_FLAGS}} -o "{{.OUTPUT}}"'
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}{{if or .EXTRA_TAGS (eq .OBFUSCATED "true")}}-tags {{if eq .OBFUSCATED "true"}}wails_obfuscated{{if .EXTRA_TAGS}},{{end}}{{end}}{{.EXTRA_TAGS}} {{end}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production{{if eq .OBFUSCATED "true"}},wails_obfuscated{{end}}{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="-w -s"{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
    env:
      GOOS: darwin
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'
      CGO_CFLAGS: "-mmacosx-version-min=13.0"
      CGO_LDFLAGS: "-mmacosx-version-min=13.0"
      MACOSX_DEPLOYMENT_TARGET: "13.0"

  build:docker:
    summary: Cross-compiles for macOS using Docker (for Linux/Windows hosts)
    internal: true
    deps:
      - task: common:build:frontend
        vars:
          OBFUSCATED:
            ref: .OBFUSCATED
      - task: common:generate:icons
    preconditions:
      - sh: docker info > /dev/null 2>&1
        msg: "Docker is required for cross-compilation. Please install Docker."
      - sh: docker image inspect {{.CROSS_IMAGE}} > /dev/null 2>&1
        msg: |
          Docker image '{{.CROSS_IMAGE}}' not found.
          Build it first: wails3 task setup:docker
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/app" {{.DOCKER_MOUNTS}} -e APP_NAME="{{.APP_NAME}}" {{if .EXTRA_TAGS}}-e EXTRA_TAGS="{{.EXTRA_TAGS}}"{{end}} {{if eq .OBFUSCATED "true"}}-e OBFUSCATED=true{{end}} {{if .GARBLE_ARGS}}-e GARBLE_ARGS="{{.GARBLE_ARGS}}"{{end}} {{.CROSS_IMAGE}} darwin {{.DOCKER_ARCH}}
      - cmd: docker run --rm -v "{{.ROOT_DIR}}:/app" alpine chown -R $(id -u):$(id -g) /app/bin
        platforms: [linux, darwin]
      - mkdir -p {{.BIN_DIR}}
      - mv "bin/{{.APP_NAME}}-darwin-{{.DOCKER_ARCH}}" "{{.OUTPUT}}"
    vars:
      DOCKER_ARCH: '{{if eq .ARCH "arm64"}}arm64{{else if eq .ARCH "amd64"}}amd64{{else}}arm64{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
      # Generate Docker volume mounts: Go module cache + go.mod replace directives
      # Uses wails3 tool docker-mounts for cross-platform compatibility (Windows/Linux/macOS)
      DOCKER_MOUNTS:
        sh: 'wails3 tool docker-mounts'

  build:universal:
    summary: Builds darwin universal binary (arm64 + amd64)
    deps:
      - task: build
        vars:
          ARCH: amd64
          OUTPUT: "{{.BIN_DIR}}/{{.APP_NAME}}-amd64"
      - task: build
        vars:
          ARCH: arm64
          OUTPUT: "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
    cmds:
      - task: '{{if eq OS "darwin"}}build:universal:lipo:native{{else}}build:universal:lipo:go{{end}}'

  build:universal:lipo:native:
    summary: Creates universal binary using native lipo (macOS)
    internal: true
    cmds:
      - lipo -create -output "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
      - rm "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"

  build:universal:lipo:go:
    summary: Creates universal binary using wails3 tool lipo (Linux/Windows)
    internal: true
    cmds:
      - wails3 tool lipo -output "{{.BIN_DIR}}/{{.APP_NAME}}" -input "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" -input "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
      - rm -f "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"

  package:
    summary: Packages a universal (arm64 + amd64) `.app` bundle with the RDP, network and VPN helpers inside
    deps:
      - task: build:universal
      - task: build:rdp-helper:universal
      - task: build:netd:universal
      - task: build:vpn:universal
      - task: build:sso
    cmds:
      - task: create:app:bundle

  build:rdp-helper:universal:
    summary: Builds the RDP helper for arm64 and amd64 and joins them into one universal binary in bin/
    dir: rdp-helper
    cmds:
      - rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - cargo build --release --target aarch64-apple-darwin
      - cargo build --release --target x86_64-apple-darwin
      - mkdir -p ../{{.BIN_DIR}}
      - lipo -create -output ../{{.BIN_DIR}}/hostbay-rdp-helper target/aarch64-apple-darwin/release/hostbay-rdp-helper target/x86_64-apple-darwin/release/hostbay-rdp-helper
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"

  build:sso:
    summary: Builds hostbay-sso, the SAML sign-in window, against the build machine's libopenconnect
    desc: |
      Skipped with a message when this machine has no openconnect (brew install
      openconnect). It links Homebrew's single-architecture library, so it
      carries the build machine's architecture only, as the bundled openconnect does.
    cmds:
      - cmd: |
          oc=$(command -v openconnect || true)
          if [ -z "$oc" ]; then
            echo "WARNING: openconnect not found: building without hostbay-sso, so gateways that sign in only in a window will fail (brew install openconnect, then rebuild)" >&2
            exit 0
          fi
          prefix=$(dirname "$(dirname "$(realpath "$oc")")")
          mkdir -p {{.BIN_DIR}}
          clang -fobjc-arc -Wall -mmacosx-version-min=13.0 -I"$prefix/include" -L"$prefix/lib" -lopenconnect \
            -framework Cocoa -framework WebKit cmd/hostbay-sso/main.m -o {{.BIN_DIR}}/hostbay-sso
        platforms: [darwin]

  build:netd:universal:
    summary: Builds hostbay-netd for arm64 and amd64 and joins them into one universal binary in bin/
    deps:
      - task: :build:netd
        vars: { GOOS: darwin, ARCH: amd64, OUTPUT: "{{.BIN_DIR}}/hostbay-netd-amd64" }
      - task: :build:netd
        vars: { GOOS: darwin, ARCH: arm64, OUTPUT: "{{.BIN_DIR}}/hostbay-netd-arm64" }
    cmds:
      - task: '{{if eq OS "darwin"}}build:netd:lipo:native{{else}}build:netd:lipo:go{{end}}'

  build:netd:lipo:native:
    internal: true
    cmds:
      - lipo -create -output "{{.BIN_DIR}}/hostbay-netd" "{{.BIN_DIR}}/hostbay-netd-amd64" "{{.BIN_DIR}}/hostbay-netd-arm64"
      - rm "{{.BIN_DIR}}/hostbay-netd-amd64" "{{.BIN_DIR}}/hostbay-netd-arm64"

  build:netd:lipo:go:
    internal: true
    cmds:
      - wails3 tool lipo -output "{{.BIN_DIR}}/hostbay-netd" -input "{{.BIN_DIR}}/hostbay-netd-amd64" -input "{{.BIN_DIR}}/hostbay-netd-arm64"
      - rm -f "{{.BIN_DIR}}/hostbay-netd-amd64" "{{.BIN_DIR}}/hostbay-netd-arm64"

  build:vpn:universal:
    summary: Builds hostbay-vpn for arm64 and amd64 and joins them into one universal binary in bin/
    deps:
      - task: :build:vpn
        vars: { GOOS: darwin, ARCH: amd64, OUTPUT: "{{.BIN_DIR}}/hostbay-vpn-amd64" }
      - task: :build:vpn
        vars: { GOOS: darwin, ARCH: arm64, OUTPUT: "{{.BIN_DIR}}/hostbay-vpn-arm64" }
    cmds:
      - task: '{{if eq OS "darwin"}}build:vpn:lipo:native{{else}}build:vpn:lipo:go{{end}}'

  build:vpn:lipo:native:
    internal: true
    cmds:
      - lipo -create -output "{{.BIN_DIR}}/hostbay-vpn" "{{.BIN_DIR}}/hostbay-vpn-amd64" "{{.BIN_DIR}}/hostbay-vpn-arm64"
      - rm "{{.BIN_DIR}}/hostbay-vpn-amd64" "{{.BIN_DIR}}/hostbay-vpn-arm64"

  build:vpn:lipo:go:
    internal: true
    cmds:
      - wails3 tool lipo -output "{{.BIN_DIR}}/hostbay-vpn" -input "{{.BIN_DIR}}/hostbay-vpn-amd64" -input "{{.BIN_DIR}}/hostbay-vpn-arm64"
      - rm -f "{{.BIN_DIR}}/hostbay-vpn-amd64" "{{.BIN_DIR}}/hostbay-vpn-arm64"

  package:dmg:
    summary: Packages the application into a styled `.dmg`
    deps:
      - task: package
    cmds:
      - task: create:dmg

  create:dmg:
    summary: Creates a configurable `.dmg` from the `.app` bundle
    platforms: [darwin]
    cmds:
      - >-
        wails3 tool package --format dmg --name "{{.APP_BUNDLE}}" --out "{{.BIN_DIR}}"
        --background "{{.DMG_BACKGROUND}}"
        --volume-icon "{{.DMG_VOLUME_ICON}}"
        --file-icon "{{.DMG_FILE_ICON}}"
        --window-width "{{.DMG_WINDOW_WIDTH}}"
        --window-height "{{.DMG_WINDOW_HEIGHT}}"
        {{if .DMG_FILES}}--files "{{.DMG_FILES}}"{{end}}
    vars:
      DMG_BACKGROUND: '{{.DMG_BACKGROUND | default "build/darwin/dmg-background.png"}}'
      DMG_VOLUME_ICON: '{{.DMG_VOLUME_ICON | default "build/darwin/icons.icns"}}'
      DMG_FILE_ICON: '{{.DMG_FILE_ICON | default "build/darwin/dmg-file-icon.icns"}}'
      DMG_WINDOW_WIDTH: '{{.DMG_WINDOW_WIDTH | default "540"}}'
      DMG_WINDOW_HEIGHT: '{{.DMG_WINDOW_HEIGHT | default "380"}}'
      DMG_FILES: '{{.DMG_FILES | default ""}}'


  create:app:bundle:
    summary: Creates an `.app` bundle
    cmds:
      - mkdir -p "{{.BIN_DIR}}/{{.APP_BUNDLE}}.app/Contents/MacOS"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_BUNDLE}}.app/Contents/Resources"
      - cp build/darwin/icons.icns "{{.BIN_DIR}}/{{.APP_BUNDLE}}.app/Contents/Resources"
      - |
        if [ -f build/darwin/Assets.car ]; then
          cp build/darwin/Assets.car "{{.BIN_DIR}}/{{.APP_BUNDLE}}.app/Contents/Resources"
        fi
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_BUNDLE}}.app/Contents/MacOS"
      # internal/rdp.HelperPath looks for the helper beside the running executable.
      - cp "{{.BIN_DIR}}/hostbay-rdp-helper" "{{.BIN_DIR}}/{{.APP_BUNDLE}}.app/Contents/MacOS"
      # internal/netd installs the helper from beside the running executable.
      - cp "{{.BIN_DIR}}/hostbay-netd" "{{.BIN_DIR}}/{{.APP_BUNDLE}}.app/Contents/MacOS"
      # internal/vpn.HelperPath looks for the VPN helper beside the running executable.
      - cp "{{.BIN_DIR}}/hostbay-vpn" "{{.BIN_DIR}}/{{.APP_BUNDLE}}.app/Contents/MacOS"
      # openconnect goes beside hostbay-vpn and its libraries in Frameworks; skipped
      # with a message when this machine has no openconnect (brew install openconnect).
      - cmd: sh build/darwin/bundle-openconnect.sh "{{.BIN_DIR}}/{{.APP_BUNDLE}}.app/Contents"
        platforms: [darwin]
      # openvpn for system-wide profiles, which hostbay-netd copies at install;
      # skipped with a message when this machine has none (brew install openvpn).
      - cmd: |
          if command -v openvpn >/dev/null 2>&1; then
            sh build/darwin/bundle-openconnect.sh "{{.BIN_DIR}}/{{.APP_BUNDLE}}.app/Contents" "$(command -v openvpn)"
          else
            echo "openvpn not found: building without bundled OpenVPN (brew install openvpn to bundle it)"
          fi
        platforms: [darwin]
      # hostbay-sso opens the sign-in window for gateways that offer no browser mode; its
      # libopenconnect is the one openconnect already brought into Frameworks.
      - cmd: |
          if [ -f "{{.BIN_DIR}}/hostbay-sso" ]; then
            sh build/darwin/bundle-openconnect.sh "{{.BIN_DIR}}/{{.APP_BUNDLE}}.app/Contents" "{{.BIN_DIR}}/hostbay-sso"
          fi
        platforms: [darwin]
      - cp build/darwin/Info.plist "{{.BIN_DIR}}/{{.APP_BUNDLE}}.app/Contents"
      - task: '{{if eq OS "darwin"}}codesign:adhoc{{else}}codesign:skip{{end}}'

  codesign:adhoc:
    summary: Ad-hoc signs the app bundle (macOS only)
    internal: true
    cmds:
      - codesign --force --deep --sign - "{{.BIN_DIR}}/{{.APP_BUNDLE}}.app"

  codesign:skip:
    summary: Skips codesigning when cross-compiling
    internal: true
    cmds:
      - 'echo "Skipping codesign (not available on {{OS}}). Sign the .app on macOS before distribution."'

  run:
    cmds:
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Resources"
      - cp build/darwin/icons.icns "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Resources"
      - |
        if [ -f build/darwin/Assets.car ]; then
          cp build/darwin/Assets.car "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Resources"
        fi
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS"
      # The helper comes from `task build:rdp-helper`; without it RDP reports a missing helper.
      - |
        if [ -f "{{.BIN_DIR}}/hostbay-rdp-helper" ]; then
          cp "{{.BIN_DIR}}/hostbay-rdp-helper" "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS"
        fi
      # The network helper comes from `task build:netd`; without it the helper cannot be installed.
      - |
        if [ -f "{{.BIN_DIR}}/hostbay-netd" ]; then
          cp "{{.BIN_DIR}}/hostbay-netd" "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS"
        fi
      # The VPN helper comes from `task build:vpn`; without it VPN profiles report a missing helper.
      - |
        if [ -f "{{.BIN_DIR}}/hostbay-vpn" ]; then
          cp "{{.BIN_DIR}}/hostbay-vpn" "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS"
        fi
      - sh build/darwin/bundle-openconnect.sh "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents"
      - cp "build/darwin/Info.dev.plist" "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Info.plist"
      - codesign --force --deep --sign - "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app"
      - '"{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS/{{.APP_NAME}}"'

  sign:
    summary: Signs the application bundle with Developer ID
    desc: |
      Signs the .app bundle for distribution.
      Uses signing identity from `wails3 setup` (stored in ~/.config/wails/defaults.yaml).
      Override with: task darwin:sign -- --identity "Developer ID Application: ..."
    deps:
      - task: package
    cmds:
      - wails3 tool sign --input "{{.BIN_DIR}}/{{.APP_BUNDLE}}.app" {{.CLI_ARGS}}

  sign:notarize:
    summary: Signs and notarizes the application bundle
    desc: |
      Signs the .app bundle and submits it for notarization.
      Uses signing identity and keychain profile from `wails3 setup`.

      First-time setup:
        wails3 setup
    deps:
      - task: package
    cmds:
      - wails3 tool sign --input "{{.BIN_DIR}}/{{.APP_BUNDLE}}.app" --notarize {{.CLI_ARGS}}
