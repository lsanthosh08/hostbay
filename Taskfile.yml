version: '3'

vars:
  APP_NAME: "hostbay"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  build:rdp-helper:
    summary: Builds the Rust RDP helper (release) into bin/, beside the app binary, where Hostbay looks for it
    # Several packaging tasks depend on it; build it once per run.
    run: once
    dir: rdp-helper
    sources:
      - src/**/*.rs
      - Cargo.toml
      - Cargo.lock
    generates:
      - ../{{.BIN_DIR}}/hostbay-rdp-helper{{exeExt}}
    cmds:
      - cargo build --release
      - mkdir -p ../{{.BIN_DIR}}
      - cp target/release/hostbay-rdp-helper{{exeExt}} ../{{.BIN_DIR}}/hostbay-rdp-helper{{exeExt}}

  build:netd:
    summary: Builds the hostbay-netd privileged helper into bin/, beside the app binary, where Hostbay's install looks for it
    # Pure Go with no cgo, so it cross-compiles with GOOS and GOARCH alone.
    cmds:
      - go build -trimpath -buildvcs=false -ldflags="-s -w" -o "{{.OUTPUT}}" ./cmd/hostbay-netd
    vars:
      NETD_EXT: '{{if eq .GOOS "windows"}}.exe{{end}}'
      OUTPUT: '{{.OUTPUT | default (print .BIN_DIR "/hostbay-netd" .NETD_EXT)}}'
    env:
      GOOS: '{{.GOOS}}'
      GOARCH: '{{.ARCH | default ARCH}}'
      CGO_ENABLED: 0

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  install:msix:tools:
    summary: Installs tools required for Windows MSIX packaging
    cmds:
      - task: windows:install:msix:tools
