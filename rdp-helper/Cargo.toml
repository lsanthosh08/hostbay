[package]
name = "hostbay-rdp-helper"
version = "0.1.0"
description = "Hostbay's RDP helper: one IronRDP session per process, driven over stdin/stdout (KTD3)"
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "hostbay-rdp-helper"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# shortcut: IronRDP pinned to the same master commit as src-tauri because
# every released ironrdp-connector pins RustCrypto pre-releases. Move to a
# crates.io version once IronRDP publishes a release on sspi 0.23.
ironrdp = { git = "https://github.com/Devolutions/IronRDP", rev = "baa9a65d6c6995ab3fdc58cf4e8ecc8351e95262", features = ["connector", "session", "graphics", "input", "pdu", "svc", "cliprdr", "rdpsnd", "dvc"] }
ironrdp-blocking = { git = "https://github.com/Devolutions/IronRDP", rev = "baa9a65d6c6995ab3fdc58cf4e8ecc8351e95262" }
# Remote speaker output and microphone input.
cpal = "0.15"
sspi = { version = "0.23", features = ["network_client"] }
rustls = { version = "0.23", features = ["ring"] }
x509-cert = "0.2"

# Native macOS clipboard, including file lists (NSPasteboard).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSEnumerator"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard"] }

# Native Windows clipboard: text and file lists (CF_HDROP).
[target.'cfg(windows)'.dependencies]
clipboard-win = "5"

[profile.release]
strip = true
lto = true
codegen-units = 1
